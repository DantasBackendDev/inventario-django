{% extends 'inventario/base.html' %}

{% block titulo %}Entrar - Inventário{% endblock %}

{% block conteudo %}
<h2>Entrar no sistema</h2>

{% if form.errors %}
<p class="erro">Usuário ou senha incorretos. Tente novamente.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao">Entrar</button>
</form>
{% endblock %}
